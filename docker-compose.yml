services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localride-postgis
    environment:
      POSTGRES_DB: localride
      POSTGRES_USER: localride
      POSTGRES_PASSWORD: localride
    ports:
      - "5432:5432"
    volumes:
      - localride_pg:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localride -d localride"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localride_pg:
